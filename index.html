<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reno App</title>
<meta name="description" content="Home renovation accounts, kept in your OneDrive.">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("ra.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reno App">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --faint:#94A3B8; --line:#E8EBF2; --track:#EEF1F6;
  --accent:#0F766E; --accent2:#0D9488; --accentSoft:#E6F4F2;
  --good:#16A34A; --goodSoft:#DCFCE7; --warn:#D97706; --warnSoft:#FEF3C7; --bad:#DC2626; --badSoft:#FEE2E2;
  --r:16px; --tabh:62px; --safeb:env(safe-area-inset-bottom,0px); --safet:env(safe-area-inset-top,0px);
  --hdr:rgba(245,246,250,.86); --navbg:rgba(255,255,255,.92); --gh:#FAFBFD; --press:#F8FAFC; --fill:#E9ECF2;
  --badInk:#991B1B; --warnInk:#92400E; --accentInk:#115E59; --toast:#0F172A; --toastInk:#fff;
  color-scheme:light;
}
/* Dark mode: follows the phone/Mac setting (Auto), or the choice on the Account page. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F17; --card:#151B26; --ink:#E8EDF5; --muted:#9AA6B8; --faint:#6B778A; --line:#232C3A; --track:#232C3A;
  --accent:#2DD4BF; --accent2:#14B8A6; --accentSoft:#0F2E2B;
  --good:#4ADE80; --goodSoft:#123220; --warn:#FBBF24; --warnSoft:#3A2C0C; --bad:#F87171; --badSoft:#3B1717;
  --hdr:rgba(11,15,23,.84); --navbg:rgba(21,27,38,.92); --gh:#121823; --press:#1B2230; --fill:#1E2633;
  --badInk:#FCA5A5; --warnInk:#FCD34D; --accentInk:#99F6E4; --toast:#E8EDF5; --toastInk:#0B0F17;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0F17; --card:#151B26; --ink:#E8EDF5; --muted:#9AA6B8; --faint:#6B778A; --line:#232C3A; --track:#232C3A;
  --accent:#2DD4BF; --accent2:#14B8A6; --accentSoft:#0F2E2B;
  --good:#4ADE80; --goodSoft:#123220; --warn:#FBBF24; --warnSoft:#3A2C0C; --bad:#F87171; --badSoft:#3B1717;
  --hdr:rgba(11,15,23,.84); --navbg:rgba(21,27,38,.92); --gh:#121823; --press:#1B2230; --fill:#1E2633;
  --badInk:#FCA5A5; --warnInk:#FCD34D; --accentInk:#99F6E4; --toast:#E8EDF5; --toastInk:#0B0F17;
  color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.02em}

/* Shell */
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(var(--safet) + 10px) 16px 10px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.topbar{display:flex;align-items:center;gap:10px;max-width:860px;margin:0 auto}
.topbar h1{font-size:28px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 4px;font-size:16px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);max-width:860px;margin:2px auto 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;flex:none}
main{max-width:860px;margin:0 auto;padding:12px 16px calc(var(--tabh) + var(--safeb) + 90px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safeb)}
nav.tabs button{flex:1;border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:10.5px;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + var(--safeb) + 16px);z-index:19;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;padding:14px 20px;font-size:15px;box-shadow:0 10px 24px rgba(15,118,110,.35);display:flex;gap:8px;align-items:center}
@media (min-width:900px){
  nav.tabs{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;padding:24px 12px;border-top:0;border-right:1px solid var(--line);gap:4px}
  nav.tabs::before{content:"Reno App";font-weight:800;font-size:18px;padding:4px 12px 18px;color:var(--ink)}
  nav.tabs button{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:10px;font-size:15px}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs button.on{background:var(--accentSoft)}
  header.top,main{margin-left:220px}
  main{padding-bottom:100px}
  .fab{bottom:28px;right:28px}
}

/* Cards and bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.tile .val{font-size:21px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:500}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:2px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 0}
.sec-h h2{font-size:18px;font-weight:700}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--track);gap:2px}
.seg i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.legend span.n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg2,var(--track));color:var(--fg,var(--muted));white-space:nowrap}
.pill.warn{--bg2:var(--warnSoft);--fg:var(--warn)} .pill.bad{--bg2:var(--badSoft);--fg:var(--bad)} .pill.good{--bg2:var(--goodSoft);--fg:var(--good)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.notice{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--badSoft);color:var(--badInk);font-size:13.5px}
.notice.warn{background:var(--warnSoft);color:var(--warnInk)}
.notice.info{background:var(--accentSoft);color:var(--accentInk)}
.notice .grow{flex:1}
.notice button{border:0;background:var(--card);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:inherit}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .gh{display:flex;justify-content:space-between;padding:10px 14px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--gh);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--press)}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 16%,var(--card));flex:none}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 17%,var(--card));flex:none}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Toolbar: search, chips, sort */
.tools{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;outline:none;height:40px;flex:1;min-width:0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink);display:flex;gap:6px;align-items:center}
.fchip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.fchip.on .sw{background:#fff}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.sortsel{position:relative;display:flex;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:12.5px}
.sortsel select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn:not(.sec):not(.danger):not(.ghost),:root[data-theme="dark"] .fab{color:#06201D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.danger):not(.ghost),:root:not([data-theme="light"]) .fab{color:#06201D}}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.ghost{background:none;color:var(--accent);padding:8px 6px}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:4px 2px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet-h h3{flex:1;text-align:center;font-size:16px;font-weight:700}
.sheet-h button{border:0;background:none;color:var(--accent);font-weight:600;font-size:15px;min-width:64px}
.sheet-h button.save{font-weight:800;text-align:right}
.sheet-b{overflow-y:auto;padding:16px 16px calc(24px + var(--safeb));-webkit-overflow-scrolling:touch}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;width:100%;min-height:44px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.field .hint{font-size:11.5px;color:var(--faint)}
.amount-in{font-size:26px !important;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg-in{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg-in button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg-in button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.group h4{margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.doc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.doc:last-of-type{border-bottom:0}
.doc .n{flex:1;min-width:0}
.doc .n b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .x{border:0;background:var(--badSoft);color:var(--bad);border-radius:8px;width:30px;height:30px;font-weight:700}
.adddoc{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.adddoc select{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);font-size:15px}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.palette button{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.palette button.on{box-shadow:0 0 0 2px var(--ink)}

/* Charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:12px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .stackbar{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;background:var(--track)}
.bars .stackbar i{display:block;width:100%}
.bars small{font-size:10.5px;color:var(--faint);white-space:nowrap}

/* Welcome / viewer / toast */
.welcome{max-width:460px;margin:0 auto;padding:calc(var(--safet) + 48px) 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;min-height:100vh;min-height:100dvh;justify-content:center}
.welcome > *{max-width:100%}
.welcome > .btn,.welcome > .group,.welcome > #browser{width:100%}
.welcome .group,.welcome #browser{text-align:left}
.welcome .spin{vertical-align:-3px;margin-right:6px}
.logo{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 24px rgba(15,118,110,.25)}
.welcome h1{font-size:32px;font-weight:800}
.viewer{position:fixed;inset:0;z-index:60;background:#0B1120;display:flex;flex-direction:column;animation:fade .15s}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:calc(var(--safet) + 10px) 14px 10px;color:#fff}
.viewer .vh b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.viewer .vh a,.viewer .vh button{color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px;text-decoration:none}
.viewer .vb{flex:1;overflow:auto;display:grid;place-items:center;padding:10px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safeb) + 80px);z-index:70;background:var(--toast);color:var(--toastInk);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .2s}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(1turn)}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:last-child{color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* App lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safet) + 20px) 24px calc(var(--safeb) + 20px)}
.lock h2{font-size:22px;font-weight:800}
.lock p{margin:0}
html.is-locked #app,html.is-locked #layer{visibility:hidden}
.pindots{display:flex;gap:14px;margin:10px 0 14px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.pindots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.keypad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--fill);font-size:28px;font-weight:500;color:var(--ink)}
.keypad button:active{background:var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script src="app.js?v=9"></script>
</body>
</html>
