<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Gold</title>
<meta name="description" content="Family gold record — kept in your own OneDrive.">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Gold">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F7F3EA; --card:#FFFFFF; --ink:#1C1710; --muted:#6F6556; --faint:#A39885; --line:#ECE4D4; --track:#F1EADC;
  --gold:#B8860B; --gold2:#D4AF37; --goldSoft:#FBF1D6; --goldInk:#7A5A08;
  --good:#15803D; --goodSoft:#DCFCE7; --bad:#C2410C; --badSoft:#FFEDD5; --info:#2563EB; --infoSoft:#DBEAFE;
  --hdr:rgba(247,243,234,.86); --navbg:rgba(255,255,255,.92); --press:#FBF8F1; --fill:#EFE8DA;
  --hero1:#2A2114; --hero2:#120E08; --heroInk:#FFF6DF;
  --r:18px; --tabh:62px; --safeb:env(safe-area-inset-bottom,0px); --safet:env(safe-area-inset-top,0px);
  --serif:"New York","Iowan Old Style",ui-serif,Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0C09; --card:#18150F; --ink:#F3ECDD; --muted:#B0A48D; --faint:#7C735F; --line:#2A251B; --track:#2A251B;
  --gold:#E2B84A; --gold2:#F2D27A; --goldSoft:#2C2412; --goldInk:#F2D27A;
  --good:#4ADE80; --goodSoft:#11291A; --bad:#FB923C; --badSoft:#33200F; --info:#60A5FA; --infoSoft:#13233D;
  --hdr:rgba(14,12,9,.84); --navbg:rgba(24,21,15,.92); --press:#1F1B14; --fill:#241F17;
  --hero1:#2B2216; --hero2:#16120B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E0C09; --card:#18150F; --ink:#F3ECDD; --muted:#B0A48D; --faint:#7C735F; --line:#2A251B; --track:#2A251B;
  --gold:#E2B84A; --gold2:#F2D27A; --goldSoft:#2C2412; --goldInk:#F2D27A;
  --good:#4ADE80; --goodSoft:#11291A; --bad:#FB923C; --badSoft:#33200F; --info:#60A5FA; --infoSoft:#13233D;
  --hdr:rgba(14,12,9,.84); --navbg:rgba(24,21,15,.92); --press:#1F1B14; --fill:#241F17;
  --hero1:#2B2216; --hero2:#16120B; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.serif{font-family:var(--serif)}

/* Shell */
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding:calc(var(--safet) + 10px) 16px 8px}
.topbar{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto}
.topbar h1{font-family:var(--serif);font-size:30px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);max-width:880px;margin:2px auto 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.busy{background:var(--gold);animation:pulse 1s infinite}
.dot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px;flex:none}
main{max-width:880px;margin:0 auto;padding:8px 16px calc(var(--tabh) + var(--safeb) + 96px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safeb)}
nav.tabs button{flex:1;border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + var(--safeb) + 16px);z-index:19;border:0;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1C1406;font-weight:800;padding:14px 20px;font-size:15px;box-shadow:0 10px 26px rgba(184,134,11,.38);display:flex;gap:8px;align-items:center}
@media (min-width:900px){
  nav.tabs{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;padding:24px 12px;border-top:0;border-right:1px solid var(--line);gap:4px}
  nav.tabs::before{content:"✦ My Gold";font-family:var(--serif);font-weight:700;font-size:21px;padding:4px 12px 20px;color:var(--gold)}
  nav.tabs button{flex:none;height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:12px;font-size:15px}
  nav.tabs button svg{width:20px;height:20px}
  nav.tabs button.on{background:var(--goldSoft)}
  header.top,main{margin-left:224px}
  .topbar,.sync{max-width:1060px}
  main{max-width:none;padding:12px max(28px, calc((100vw - 224px - 1060px) / 2)) 100px}
  .fab{bottom:28px;right:28px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-top:14px}
  .grid2>.card{margin-top:0}
}

/* Cards and lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.hero{border-radius:24px;padding:20px;margin-top:8px;color:var(--heroInk);background:radial-gradient(120% 140% at 100% 0%,#5A4318 0%,transparent 55%),linear-gradient(160deg,var(--hero1),var(--hero2));position:relative;overflow:hidden;border:1px solid rgba(226,184,74,.25)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,230,160,.08) 45%,transparent 60%);pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#D9C38F;font-weight:700}
.hero .big{font-family:var(--serif);font-size:40px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em;background:linear-gradient(180deg,#FFF1C9,#E2B84A);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:#E9DCB9;font-size:14px}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hero .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.hero .stat .k{font-size:11px;color:#CDBB8E;text-transform:uppercase;letter-spacing:.06em}
.hero .stat .v{font-weight:700;font-size:16px;margin-top:2px;white-space:nowrap}
.up{color:var(--good)} .down{color:var(--bad)}
.hero .up{color:#86EFAC} .hero .down{color:#FDBA74}

.mkt{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 0;font-weight:700;font-size:13.5px}
.mkt .faint{font-weight:500;font-size:12px}
.rates{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.rates::-webkit-scrollbar{display:none}
.rate{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:116px}
.rate .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.rate .v{font-weight:700;font-size:15px;margin-top:2px}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%;display:block}
.person:active{background:var(--press)}
.ph{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c);flex:none;font-size:15px}
.person .name{font-weight:700;font-size:16px}
.person .val{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:10px}
.person .meta{display:flex;gap:10px;color:var(--muted);font-size:13px;margin-top:2px;flex-wrap:wrap}

.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c)}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.row:first-child{border-top:0}
button.row:active{background:var(--press)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r .a{font-weight:700}
.row .r .b{font-size:12.5px}
.thumb{width:52px;height:52px;border-radius:12px;flex:none;background:var(--goldSoft) center/cover no-repeat;display:grid;place-items:center;font-size:24px;border:1px solid var(--line)}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--goldSoft);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--goldSoft);color:var(--goldInk)}
.chip.good{background:var(--goodSoft);color:var(--good)}
.chip.bad{background:var(--badSoft);color:var(--bad)}
.chip.info{background:var(--infoSoft);color:var(--info)}
.gh{padding:9px 14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--press);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}

.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.filters{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;outline:none;flex:1;padding:10px 0;min-width:0}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--press);border:1px solid var(--line);border-radius:14px;padding:12px}
.box .k{font-size:12px;color:var(--muted);font-weight:600}
.box .v{font-size:18px;font-weight:700;margin-top:2px}

.empty{text-align:center;color:var(--muted);padding:28px 16px}
.small{font-size:13px}.faint{color:var(--faint)}.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1C1406;font-weight:800;padding:13px 16px;font-size:15.5px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--fill);color:var(--ink);font-weight:700}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--gold);font-weight:700;padding:4px 0}
.note{background:var(--goldSoft);color:var(--goldInk);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.note.info{background:var(--infoSoft);color:var(--info)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field>span{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none;width:100%;min-width:0;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field .hint{font-size:12px;color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>.field{min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-weight:600;font-size:14px}
.pills button.on{background:var(--goldSoft);border-color:var(--gold);color:var(--goldInk)}
.inwrap{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden}
.inwrap input{border:0!important;border-radius:0!important}
.inwrap select{border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;width:92px!important;flex:none;background:var(--press)}
.inwrap em{font-style:normal;color:var(--muted);padding:0 12px;font-size:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,4,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:94vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:18px;font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sb{overflow-y:auto;padding:4px 16px calc(var(--safeb) + 24px);-webkit-overflow-scrolling:touch}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:22px;transform:translateY(-40%);opacity:0;max-height:88vh}.sheet.on{transform:translateY(-50%);opacity:1}}

.gallery{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery .g{flex:none;width:110px;height:110px;border-radius:14px;background:var(--goldSoft) center/cover no-repeat;border:1px solid var(--line);position:relative}
.gallery .g.add{display:grid;place-items:center;font-size:13px;color:var(--goldInk);font-weight:700;text-align:center;border-style:dashed;border-color:var(--gold)}
.gallery .g .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.photo-hero.empty{aspect-ratio:auto;height:150px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;border:1.5px dashed var(--gold);cursor:pointer}
.photo-hero{width:100%;aspect-ratio:4/3;border-radius:18px;background:var(--goldSoft) center/cover no-repeat;margin-top:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:64px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safeb) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.spin{display:inline-block;width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(var(--safet) + 12px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px}

/* Welcome */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;text-align:center;background:radial-gradient(90% 60% at 50% 0%,#4A3714 0%,transparent 70%),linear-gradient(180deg,#1A140B,#0B0905);color:#FFF6DF}
.welcome img{width:96px;height:96px;border-radius:24px;box-shadow:0 18px 50px rgba(226,184,74,.25)}
.welcome h1{font-family:var(--serif);font-size:40px;margin-top:18px;background:linear-gradient(180deg,#FFF1C9,#E2B84A);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:#D9C9A3;max-width:400px;margin:10px auto 0}
.welcome .acts{width:100%;max-width:360px;margin-top:28px;display:flex;flex-direction:column;gap:10px}
.welcome .btn.sec{background:rgba(255,255,255,.09);color:#FFF6DF}
.welcome .feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:400px;margin-top:22px;text-align:left;font-size:13px;color:#D9C9A3}
.welcome .feat div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px}

/* App lock */
.lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--safet) + 20px) 24px calc(var(--safeb) + 20px);
  background:radial-gradient(90% 55% at 50% 0%,#4A3714 0%,transparent 70%),linear-gradient(180deg,#1A140B,#0B0905);color:#FFF6DF}
.lock .logo{width:76px;height:76px;border-radius:20px;box-shadow:0 14px 40px rgba(226,184,74,.25)}
.lock h2{font-family:var(--serif);font-size:26px;background:linear-gradient(180deg,#FFF1C9,#E2B84A);-webkit-background-clip:text;background-clip:text;color:transparent}
.lock p{margin:0;color:#D9C9A3}
.lock .linkbtn{color:#E2B84A}
html.is-locked #app,html.is-locked .sheet,html.is-locked .scrim{visibility:hidden}
.pindots{display:flex;gap:14px;margin:10px 0 14px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid #A8987A}
.pindots i.on{background:#E2B84A;border-color:#E2B84A}
.pindots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px}
.keypad button{width:76px;height:76px;border-radius:50%;border:1px solid rgba(226,184,74,.22);background:rgba(255,255,255,.06);font-size:28px;font-weight:400;color:#FFF6DF}
.keypad button:active{background:rgba(226,184,74,.25)}
.keypad span{width:76px}
.scan{background:var(--goldSoft);border:1px solid var(--gold);border-radius:16px;padding:12px;margin-top:12px}
.scanrow{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div id="app"><div class="welcome"><img src="icons/icon-512.png" alt=""><h1>My Gold</h1><p>Loading…</p></div></div>
<script src="bill.js?v=1.0.11"></script>
<script src="app.js?v=1.0.11"></script>
</body>
</html>
